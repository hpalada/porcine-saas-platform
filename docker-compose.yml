version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: porcine-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: porcine-saas
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - porcine-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: porcine-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/porcine-saas
      - PORT=3001
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
    networks:
      - porcine-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: porcine-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - porcine-network
    command: npm run dev

volumes:
  mongodb_data:
    driver: local

networks:
  porcine-network:
    driver: bridge
